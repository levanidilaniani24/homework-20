<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clock & Slider</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <section class="clock-section">
        <div id="clock">00:00:00 PM</div>
    </section>
    <section class="slider-section">

        <h2>Image Slider</h2>

        <div class="slider">
            <img
                id="slider-image"
                src="./images/image1.png"
                alt="Slider image"
            >
        </div>
    </section>

    <section class="countdown-section">
        <h2>Countdown</h2>
        <div id="countdown">

            <div class="time-box">
                <span id="days">0</span>
                <small>Days</small>
            </div>

            <div class="time-box">
                <span id="hours">0</span>
                <small>Hours</small>
            </div>

            <div class="time-box">
                <span id="minutes">0</span>
                <small>Minutes</small>
            </div>

        </div>
    </section>

    <script src="./app.js"></script>

</body>
</html>
